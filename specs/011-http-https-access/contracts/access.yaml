openapi: 3.0.3
info:
  title: SCP-cv 网页入口发现
  version: 1.1.0
  description: Vite网页服务只读入口，不属于ControlHost信令。
  license:
    name: Artistic-2.0
    url: https://opensource.org/license/artistic-2-0
servers:
  - url: http://127.0.0.1:5173
tags:
  - name: web-access
    description: 网页服务的无秘密入口发现，不属于ControlHost认证API
paths:
  /.well-known/scp-cv-access:
    get:
      tags: [web-access]
      operationId: discoverWebAccess
      summary: 获取同网页HTTPS端口
      description: HTTPS返回实际端口；配置TLS时HTTP先307跳到同主机HTTPS，无TLS开发入口返回null。
      security: []
      responses:
        '200':
          description: 无秘密入口信息
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, httpsPort]
                properties:
                  version:
                    type: integer
                    enum: [1]
                  httpsPort:
                    type: integer
                    minimum: 1
                    maximum: 65535
                    nullable: true
        '405':
          description: 不允许写请求
        '307':
          description: HTTP进入同主机HTTPS入口，保留请求路径与查询
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
        '400':
          description: 主机或请求目标无效
        '503':
          description: 已配置HTTPS但安全入口尚未就绪
