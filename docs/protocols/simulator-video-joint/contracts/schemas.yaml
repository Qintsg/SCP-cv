# 原客户端逆向HTTP契约；UTF-8、LF。
Login:
  type: object
  required:
  - request
  - username
  - password
  properties:
    request:
      type: string
      enum:
      - cclogin
    username:
      type: string
      minLength: 1
    password:
      type: string
      minLength: 1
      writeOnly: true
  additionalProperties: true
UploadCurrentState:
  type: object
  required:
  - request
  - userid
  - data
  properties:
    request:
      type: string
      enum:
      - csdata
    userid: &id001
      type: string
      minLength: 1
      description: 管理登录返回的 userid。
    data:
      type: object
      additionalProperties: true
      description: VideoJoint、Matrix、Audio、Mark 等控制资料；详见状态同步章节。
  additionalProperties: true
SaveJointPreview:
  type: object
  required:
  - request
  - userid
  - index
  - jointid
  - picname
  - data
  properties:
    request:
      type: string
      enum:
      - addJointInfo
    userid: *id001
    index:
      description: 原客户端字段。
      oneOf:
      - type: string
      - type: integer
    jointid:
      description: 原客户端字段。
      oneOf:
      - type: string
      - type: integer
    picname:
      type: string
    data:
      description: 预览矩形记录；数组／序列化表示的具体分支待继续核对。
      oneOf:
      - type: array
        items:
          type: object
          properties:
            nX:
              type: number
            nY:
              type: number
            nWidth:
              type: number
            nHeight:
              type: number
          additionalProperties: true
      - type: string
  additionalProperties: true
RenameDevice:
  type: object
  required:
  - request
  - DeviceId
  - NewDeviceName
  properties:
    request:
      type: string
      enum:
      - ReNameDevice
    DeviceId:
      description: 原客户端字段。
      oneOf:
      - type: string
      - type: integer
    NewDeviceName:
      type: string
  additionalProperties: true
RestoreDeviceName:
  type: object
  required:
  - request
  - DeviceId
  properties:
    request:
      type: string
      enum:
      - ReductionName
    DeviceId:
      description: 原客户端字段。
      oneOf:
      - type: string
      - type: integer
  additionalProperties: true
