ManagementReply:
  type: object
  description: 不同管理操作使用不同返回键。只有登录成功响应做过真实业务验证。
  properties:
    response:
      type: string
    userid:
      type: string
    result:
      type: string
    data:
      description: 原样保留；部分历史操作返回包含JSON的字符串。
    VideoJoint:
      type: array
      items:
        type: object
        properties:
          Area:
            type: array
            items:
              type: object
              additionalProperties: true
          Input:
            type: array
            items:
              type: object
              additionalProperties: true
          Limit:
            type: array
            items:
              type: object
              additionalProperties: true
          Other:
            type: array
            items:
              type: object
              additionalProperties: true
        additionalProperties: true
  additionalProperties: true
