        sharing_key:
          $ref: '#/components/schemas/SharingKey'
        source_id:
          type: integer
          format: int64
          nullable: true
        source_revision:
          type: integer
          format: int64
        expires_at:
          type: string
          format: date-time
        quality:
          $ref: '#/components/schemas/Quality'
    Created:
