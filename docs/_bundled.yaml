openapi: 3.0.3
info:
  title: SCP-cv REST API
  version: 1.0.0
  license:
    name: Artistic License 2.0
    url: https://opensource.org/license/artistic-2-0
  contact:
    name: SCP-cv 维护团队
  description: |
    SCP-cv 控制台 REST API 文档。

    所有业务路径默认挂载在 `/api` 前缀下；成功响应通常包含 `success: true`，错误响应统一为 `detail + code`。
    业务接口与 `/media/` 文件由 ControlHost 会话 Cookie 鉴权保护；`/auth/csrf/`、`/auth/login/`、`/auth/logout/` 和 `/auth/status/` 为公开入口，`/auth/me/` 要求登录。
    HTTPS使用Secure的sessionid/csrftoken，HTTP使用sessionid_http/csrftoken_http；票据绑定协议，注销只清当前入口。写操作要求当前协议防伪令牌及合法Origin。
    屏幕共享发布者沿用会话/CSRF；原生接收端点仅loopback与私有Authorization Bearer能力，不允许用户Cookie或查询串token代替。
servers:
  - url: /api
    description: 本机 ControlHost REST API 前缀
  - url: http://127.0.0.1:18444/api
    description: 普通本机后端入口（明文）
  - url: https://127.0.0.1:18443/api
    description: 加密本机后端入口，须正常信任证书
security:
  - sessionAuth: []
  - sessionAuthHttp: []
tags:
  - name: inputs
    description: 受信现场输入、别名和有界服务端口发现
  - name: display-routing
    description: 大屏与两电视的逻辑下发记账，非实体读回
  - name: auth
    description: 登录、登出、CSRF 与当前用户查询
  - name: folders
    description: 媒体文件夹管理
  - name: sources
    description: 媒体源管理、上传、预览与 PPT 页资源
  - name: sessions
    description: 播放会话查询
  - name: playback
    description: 窗口播放、切换、重置和物理冒烟测试
  - name: screen-sharing
    description: 临时网页屏幕共享的发布和原生私有信令；受理不等于出画
  - name: stream-preview
    description: 按需共享的无声FLV预览；先申请短租约再观看，不暴露原始设备凭据
  - name: background-audio
    description: 背景音乐播放列表、播放控制与状态查询
  - name: runtime
    description: 全局运行态、系统音量与系统关闭请求
  - name: video-wall
    description: 大屏固定预设与手动映射草稿；未知控制帧仅可保存预览，不可实体应用
  - name: settings
    description: 跨控制端共享的实验性功能设置
  - name: displays
    description: 显示器枚举与窗口显示目标选择
  - name: devices
    description: 外部设备电源控制
  - name: scenarios
    description: 预案创建、编辑、捕获、置顶与激活
  - name: events
    description: Server-Sent Events 播放状态事件流
paths:
  /inputs/:
    get:
      tags:
        - inputs
      summary: 读取现场输入及发现缓存
      operationId: listSiteInputs
      description: GET不探网络或写业务库；工作站51–74、监控76、现场81、摄像机84–88，不存在75。
      responses:
        '200':
          description: 固定目录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /inputs/refresh/:
    post:
      tags:
        - inputs
      summary: 合并刷新服务可达快照并同步工作站目录
      operationId: refreshSiteInputs
      description: 固定31项，最多6项并发、单端口250ms、默认TTL60秒；Simulation全部unknown且不连接网络。不会接管同名用户目录。
      security:
        - sessionAuth: []
          csrfToken: []
        - sessionAuthHttp: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                force:
                  type: boolean
                  default: false
      responses:
        '200':
          description: 可达快照；不是媒体出画状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: 内置目录与用户目录冲突，未接管
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /display-routing/:
    get:
      tags:
        - display-routing
      summary: 获取大屏和两电视最后下发意图
      operationId: getDisplayRouting
      responses:
        '200':
          description: 逻辑记录；不是现场实时状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - outputs
                    properties:
                      outputs:
                        type: object
                        required:
                          - wall
                          - tv_left
                          - tv_right
                        properties:
                          wall:
                            $ref: '#/components/schemas/DisplayRoutingTarget'
                          tv_left:
                            $ref: '#/components/schemas/DisplayRoutingTarget'
                          tv_right:
                            $ref: '#/components/schemas/DisplayRoutingTarget'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /display-routing/televisions/{target}/:
    put:
      tags:
        - display-routing
      summary: 电视单路全屏选源
      description: 同连接先满屏后单源，全部写完才记录成功意图。force默认为true，仪表盘可同源重发；不操作电源
      operationId: setTelevisionRouting
      parameters:
        - name: target
          in: path
          required: true
          schema:
            type: string
            enum:
              - tv_left
              - tv_right
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - input
              properties:
                input:
                  $ref: '#/components/schemas/VideoWallInput'
                force:
                  type: boolean
                  default: true
      responses:
        '200':
          description: 完整写出、模拟写出或按请求跳过相同意图，不证明实体出画
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - output
                      - result
                    properties:
                      output:
                        $ref: '#/components/schemas/DisplayRoutingTarget'
                      result:
                        type: string
                        enum:
                          - sent_unconfirmed
                          - simulated
                          - unchanged
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /stream-previews/native/resolve/:
    post:
      tags:
        - stream-preview
      operationId: resolveNativeStreamPreview
      summary: 为受信原生主进程解析已有来源，不拉流、不创建服务器租约
      description: 沿当前入口Cookie/CSRF/Origin及来源验证，响应Cache-Control:no-store。 uri可能包含凭据，原生主进程不得将响应原样交给renderer、缓存到页面或记录日志。 主进程每次续租重新解析固定target，完整登录票据/Origin/实际URI改变将得到不同sharing_key；修订单独复核。 普通Web仍使用共享FLV租约，不调用该敏感描述符接口。
      security:
        - sessionAuth: []
          csrfToken: []
        - sessionAuthHttp: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
      responses:
        '200':
          description: 30秒内有效的受限来源描述，不等于设备可达或已经出画
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeDescriptor'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
  /stream-previews/:
    post:
      tags:
        - stream-preview
      operationId: createStreamPreview
      summary: 申请本人短期观看租约，不立即拉流
      description: 只接受登记媒体ID或受限设备输入。有效观看消费后才注册MediaMTX按需路径；相同实际URI和凭据共享一份上游及编码。 租约绑定加密会话票据摘要、入口协议及Origin；同账号重新登录也不可使用旧租约。未消费的租约到期不会启动上游。
      security:
        - sessionAuth: []
          csrfToken: []
        - sessionAuthHttp: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
            example:
              input:
                kind: window_1
              quality: low
      responses:
        '201':
          description: 已登记观看意图；不表示设备在线或已出画
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Created'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          description: preview_no_stream；无流或未登记输入，卡片显示普通空态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /stream-previews/status/:
    get:
      tags:
        - stream-preview
      operationId: getStreamPreviewStatus
      summary: 读取预览预算与共享项数量，不探测设备
      responses:
        '200':
          description: 只读内存摘要，不代表依赖或实际画面已确认
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /stream-previews/{id}/:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - stream-preview
      operationId: getStreamPreviewLease
      summary: 读取本人同登录代次租约
      responses:
        '200':
          description: 当前租约
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags:
        - stream-preview
      operationId: closeStreamPreviewLease
      summary: 释放本人租约与其消费连接
      security:
        - sessionAuth: []
          csrfToken: []
        - sessionAuthHttp: []
          csrfToken: []
      responses:
        '204':
          description: 此租约已释放；最后消费者离开后有限宽限释放共享上游
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
  /stream-previews/{id}/heartbeat/:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - stream-preview
      operationId: heartbeatStreamPreview
      summary: 续期本人有效租约，不复活已过期会话
      description: 网页每10秒续租，30秒失联到期；普通无body续租时源修订改变则释放并返回410。 共享池为每target保留一份非消费验证租约，单独消费租约可提交aliases。 aliases必须同Owner/Origin/实际URI且来源修订仍有效，完整校验后仅切换消费租约的校验快照，不允许换实际流。 别名失效返回409且不续期，调用方须先重查别名；无有效别名不能无限续旧流。
      security:
        - sessionAuth: []
          csrfToken: []
        - sessionAuthHttp: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedHeartbeat'
      responses:
        '200':
          description: 已续租
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
  /stream-previews/{id}/stream.flv:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - stream-preview
      operationId: readStreamPreviewHttpFlv
      summary: 消费已有本人租约的HTTP-FLV
      description: 一租约只允许一个连接。先等待有效完整关键帧组再发送200；首帧等待最多12秒。 Cache-Control为no-store；无音轨。200只证明开始发送FLV，不证明浏览器已解码。 慢客户端只追赶完整GOP，全局限速、降码率与帧率；流开始后故障关闭连接，前端内联重连。
      responses:
        '200':
          description: 持续二进制FLV文件头与完整tag，不是JSON
          content:
            video/x-flv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /stream-previews/{id}/stream.ws:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - stream-preview
      operationId: readStreamPreviewWebSocketFlv
      summary: 升级为本人租约的WebSocket-FLV
      description: 必须有效Cookie、精确Origin和WebSocket升级。二进制消息承载连续FLV，不接受文字控制命令。 无查询串token；HTTP与HTTPS会话隔离，WSS证书验证不可关闭。
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
      responses:
        '101':
          description: 切换协议，后续二进制WebSocket消息为FLV字节
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /venue/:
    get:
      tags:
        - devices
      summary: 获取现场摄像机与音频能力
      operationId: getVenue
      responses:
        '200':
          description: 成功；发送/读回/仿真状态见响应详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  venue:
                    $ref: '#/components/schemas/VenueState'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /venue/audio/read/:
    post:
      tags:
        - devices
      summary: 只读查询并记录实际屏幕音量
      operationId: readVenueAudio
      responses:
        '200':
          description: 成功；发送/读回/仿真状态见响应详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  audio:
                    $ref: '#/components/schemas/VenueAudioResult'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /venue/audio/:
    put:
      tags:
        - devices
      summary: 配置IP81/SCP-cv来源、输出155增益或中控三路音量
      operationId: setVenueAudio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueAudioSettings'
      responses:
        '200':
          description: 成功；发送/读回/仿真状态见响应详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  audio:
                    $ref: '#/components/schemas/VenueAudioResult'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /venue/cameras/{id}/motion/:
    post:
      tags:
        - devices
      summary: 摄像机方向/变焦短租约控制
      operationId: moveVenueCamera
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            enum:
              - rear
              - center1
              - center2
              - left
              - right
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraMotionRequest'
      responses:
        '200':
          description: 只表示发送或租约处理；没有机械状态读回。仿真不会写实体。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  camera:
                    $ref: '#/components/schemas/VenueCameraResult'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /venue/cameras/{id}/positions/{position}/{action}/:
    post:
      tags:
        - devices
      summary: 保存或调用工程绑定的六个摄像机位置
      operationId: venueCameraPosition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            enum:
              - rear
              - center1
              - center2
              - left
              - right
        - name: position
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 6
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum:
              - save
              - call
      responses:
        '200':
          description: 模式按钮及位置按钮已写出；没有位置读回，不自动重试。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  camera:
                    $ref: '#/components/schemas/VenueCameraResult'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /scenario-folders/:
    get:
      tags:
        - scenarios
      summary: 列出预设目录
      operationId: listScenarioFolders
      responses:
        '200':
          description: 成功；发送/读回/仿真状态见响应详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  folders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Folder'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags:
        - scenarios
      summary: 新建预设目录
      operationId: createScenarioFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioFolderRequest'
      responses:
        '200':
          description: 成功；发送/读回/仿真状态见响应详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  folder:
                    $ref: '#/components/schemas/Folder'
        '201':
          description: 成功；发送/读回/仿真状态见响应详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  folder:
                    $ref: '#/components/schemas/Folder'
        '400':
