        upstream_count:
          type: integer
          minimum: 0
          description: 含关闭中的共享项数量，不是设备在线数量
        max_upstreams:
          type: integer
        egress_kbps:
          type: integer
          description: 配置的预览总出站上限，不是当前吞吐或系统QoS保证
        mode:
          type: string
          enum:
            - server_flv
        detail:
          type: string
    Lease:
      type: object
      required:
        - id
        - expiresAt
        - connected
        - status
      properties:
        id:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        connected:
          type: boolean
          description: 已有消费连接，不等于浏览器已实际解码
        status:
          type: string
          enum:
            - idle
            - connecting
            - live
            - reconnecting
            - unavailable
    SharedHeartbeat:
      type: object
      additionalProperties: false
      required:
        - aliases
      properties:
        aliases:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: 同归属、同实际流、仍有效的非消费验证租约；不能包含当前消费租约
    VenueAudioSettings:
      type: object
      description: 未配置为保持。screen_volume为155读回增益；computer_volume、handheld_volume与headset_volume为中控请求百分比，按floor(percent*19/100)换算原工程0–19共20档，非DSP读回。悬挂与头戴为同一组，hanging_volume是兼容输入别名；不同值冲突或SCP-cv软件输出未就绪时409且全部零写出。IP81可独立发送。
      properties:
        screen_volume:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        handheld_volume:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        computer_volume:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: 原工程电脑音频滑杆Join3，SQL Lock=19为满量程，不是255或65535。
        headset_volume:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: 悬挂（头戴）话筒，原工程头戴1/2分组Join1。唯一保存与响应字段；旧hanging_volume规范化到此字段。
        hanging_volume:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          deprecated: true
          description: 用户已确认与headset_volume为同一组的旧输入别名。单独提交仍可用；两个非空值相同只发Join1一次，不同则首包前拒绝；保存与响应规范化为headset_volume，hanging_volume为null。
        source:
          type: string
          nullable: true
          enum:
            - ip81
            - scp_cv
            - null
          description: 固定输出155/音频通道1选择IP81或软件总线63；请求值不是实体路由读回。SCP-cv需要可信启动输出与私有引擎通过预检。
    VenueState:
      type: object
      required:
        - cameras
        - audio
        - capabilities
        - simulation
      properties:
        cameras:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - path
              - source_id
              - stream_configured
              - movable
              - control_available
              - unavailable_reason
            properties:
              id:
                type: string
                enum:
                  - rear
                  - center1
                  - center2
                  - left
                  - right
                  - fixed
              name:
                type: string
              path:
                type: string
              source_id:
                type: integer
                description: 目录冲突未同步时为0，不得用作播放目标
              stream_configured:
                type: boolean
              movable:
                type: boolean
              control_available:
                type: boolean
                description: 已装配绑定，可以发送；不是摄像机在线或机械动作确认。
              position_count:
                type: integer
                enum:
                  - 0
                  - 6
              motion_intent:
                type: string
                enum:
                  - idle
                  - held
                  - stop_pending
                description: 本服务意图；stop_pending表示安全释放仍未写出，不是物理角度。
              unavailable_reason:
                type: string
        audio:
          $ref: '#/components/schemas/VenueAudioSettings'
        capabilities:
          type: object
          properties:
            screen_volume:
              type: boolean
            computer_volume:
              type: boolean
            handheld_volume:
              type: boolean
            headset_volume:
              type: boolean
              description: 原头戴1/2即悬挂话筒；与hanging_volume为同一通道的发送能力，不是DSP读回。
            hanging_volume:
              type: boolean
              description: 与headset_volume相同，仅表示兼容旧输入，不是额外话筒分组。
            source:
              type: boolean
              description: 是否装配固定二选一来源传输；具体选项还需检查source_ip81/source_scp_cv。
            source_ip81:
              type: boolean
              description: IP81来源的发送能力，不依赖软件输出，不代表实体路由读回。
            source_scp_cv:
              type: boolean
              description: 已确认63号总线的活动端点、两个窗口私有网页/Office引擎及声音策略接口通过只读预检；发送前再次预检。
            reason:
              type: string
            hanging_label:
              type: string
            headset_label:
              type: string
        server_time_ms:
          type: integer
          format: int64
          description: 供控制端修正开始请求的时钟偏差，不代表运动事件时间。
        simulation:
          type: boolean
    VenueAudioResult:
      type: object
      required:
        - status
        - detail
      properties:
        status:
          type: string
          enum:
            - not_sent
            - confirmed
            - simulated
            - unchanged
            - uncertain
            - sent_unconfirmed
            - mismatch
        detail:
          type: string
        screen_volume:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        source:
          type: string
          nullable: true
          enum:
            - ip81
            - scp_cv
            - null
          description: 本次已完成写出的来源请求，可能出现在后续阶段失败的响应中；不是实体路由读回。
        sent_fields:
          type: array
          description: 本次已完成TCP写出的字段；不等于设备执行或可听确认。
          items:
            type: string
            enum:
              - screen_volume
              - computer_volume
              - handheld_volume
              - headset_volume
              - source
        failed_field:
          type: string
          nullable: true
          description: 失败或不确定阶段；已写出项不自动回滚/重发。
    CameraMotionRequest:
      type: object
      required:
        - direction
        - phase
        - motion_id
        - issued_at_ms
      properties:
        direction:
          type: string
          enum:
