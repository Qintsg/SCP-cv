        http_path:
          type: string
          description: 同Host的完整/api/stream-previews/{id}/stream.flv相对路径；播放器须先解析为绝对URL
        ws_path:
          type: string
          description: 同Host的完整/api/stream-previews/{id}/stream.ws相对路径
    Status:
      type: object
      required:
        - lease_count
        - upstream_count
        - max_upstreams
        - egress_kbps
        - mode
        - detail
      properties:
        lease_count:
          type: integer
          minimum: 0
