          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: media_cleanup_pending
                detail: 源记录已删除，但隔离原件清理未完成；清单保留在 media/.staging，请维护人员检查。
  /sessions/:
    get:
      tags:
        - sessions
      summary: 获取全部窗口会话快照
      operationId: listSessions
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /screen-shares/:
    post:
      tags:
        - screen-sharing
      summary: 预约窗口1或2的临时共享，不排OPEN
      operationId: createScreenShare
      security:
        - sessionAuth: []
          csrfToken: []
        - sessionAuthHttp: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/ShareResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /screen-shares/{share_id}/:
    parameters:
      - $ref: '#/components/parameters/ShareId'
    get:
      tags:
        - screen-sharing
      summary: 读取本人的共享状态和一次性应答
      operationId: getScreenShare
      responses:
        '200':
          $ref: '#/components/responses/ShareResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags:
        - screen-sharing
      summary: 立即撤销共享授权并条件停止原目标
      operationId: stopScreenShare
      description: 重复停止幂等。未OPEN直接closed；已OPEN保持stopping直到独立原生释放证明，不能关闭后来内容。
      security:
        - sessionAuth: []
          csrfToken: []
        - sessionAuthHttp: []
          csrfToken: []
      responses:
        '200':
          $ref: '#/components/responses/ShareResponse'
        '400':
