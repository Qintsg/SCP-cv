            - down
            - left
            - right
            - zoom_in
            - zoom_out
        phase:
          type: string
          enum:
            - start
            - hold
            - stop
          description: 开始后每300ms续租；无有效续租900ms后服务端独立释放。stop不继承客户端取消。
        motion_id:
          type: string
          format: uuid
        issued_at_ms:
          type: integer
          format: int64
          description: 使用venue.server_time_ms校正的开始时间；开始超过2秒或未来超过250ms拒绝。续租不能重新启动。
    VenueCameraResult:
      type: object
      required:
        - status
        - detail
      properties:
        status:
          type: string
          enum:
            - not_sent
            - sent_unconfirmed
            - simulated
        detail:
          type: string
        motion_id:
          type: string
          format: uuid
          nullable: true
    Folder:
      type: object
      required:
        - id
        - name
      properties:
        is_protected:
          type: boolean
        id:
          type: integer
        name:
          type: string
        relative_path:
          type: string
          description: 以/开始的目录路径，使用正斜杠分隔；内置目录不可添加或修改
        parent_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    ScenarioFolderRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        parent_id:
          type: integer
          nullable: true
          description: 完整更新的父目录；null为根
    CsrfTokenResponse:
