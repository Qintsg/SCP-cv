  /sources/:
    get:
      tags:
        - sources
      summary: 获取媒体源列表
      operationId: listSources
      parameters:
        - in: query
          name: source_type
          schema:
            $ref: '#/components/schemas/SourceType'
          required: false
          description: 按媒体类型筛选
        - in: query
          name: folder_id
          schema:
            type: integer
          required: false
          description: 按文件夹筛选，`-1` 表示根目录
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcesResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /sources/upload/:
    post:
      tags:
        - sources
      summary: 上传文件并创建媒体源
      description: 支持 PDF、PPT/PPS/POT/ODP、视频、音频和图片等文件。文稿原件按用户目录保留，LibreOffice 独立作业准备页图及图片 PDF；准备失败不等于原件丢失。动态文稿默认使用 LibreOffice，静态回退须明确选择。OOXML 声明扩展或可解析 ZIP 中的演示包内容采用相同外链预检，不能靠改扩展名绕过；已知危险包准备失败并保留原件。禁止宏执行与自动更新，不承诺所有旧格式、宏或加密文稿都已在预检阶段识别。
      operationId: uploadSource
      x-upload-request-limit-bytes: 1073741824
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                source_type:
                  $ref: '#/components/schemas/SourceType'
                folder_id:
                  type: integer
                  nullable: true
                is_temporary:
                  type: boolean
                preheat_enabled:
                  type: boolean
                  default: true
                  description: 是否在播放器启动时预热该媒体源
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          description: 完整上传请求超过1GiB有限上限，返回upload_too_large；文件、表单字段及multipart开销均计入总请求，不登记媒体源。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sources/local/:
    post:
      tags:
        - sources
      summary: 通过本地路径创建媒体源
      description: 路径必须位于 `LOCAL_MEDIA_ALLOWED_ROOTS` 配置的目录中。静态演示文稿会尝试转换为 PDF，动态演示文稿使用 PowerPoint。
      operationId: addLocalSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalSourceCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /sources/web/:
    post:
      tags:
        - sources
      summary: 通过网页 URL 创建媒体源
      operationId: addWebSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSourceCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '400':
