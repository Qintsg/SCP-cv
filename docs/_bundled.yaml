  /auth/csrf/:
    get:
      tags:
        - auth
      summary: 获取 CSRF token
      description: |
        显式触发当前入口的防伪Cookie下发：HTTPS为csrftoken，HTTP为csrftoken_http。前端首次加载时调用，之后在不安全方法中把对应值写入X-CSRFToken，不跨协议替用。
      operationId: getCsrfToken
      security: []
      responses:
        '200':
          description: CSRF token 已下发
          headers:
            Set-Cookie:
              description: 当前协议的csrftoken或csrftoken_http，不修改另一协议Cookie。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /auth/login/:
    post:
      tags:
        - auth
      summary: 登录并建立 ControlHost 会话
      description: |
        使用用户名和密码登录。登录成功后响应会设置 `sessionid` 与 `csrftoken` cookie，后续业务接口使用该会话访问。
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              description: '`sessionid` 与 `csrftoken` cookie'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /auth/logout/:
    post:
      tags:
        - auth
      summary: 登出并清除当前 session
      description: 未登录可幂等注销；已登录须当前协议CSRF及合法Origin。成功只清当前协议会话/防伪Cookie，保留另一入口会话，返回成功说明。
      operationId: logout
      security: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /auth/me/:
    get:
      tags:
        - auth
      summary: 获取当前登录用户
      description: 前端首屏用该接口判断当前浏览器会话是否已登录。
      operationId: getCurrentUser
      security:
        - sessionAuth: []
        - sessionAuthHttp: []
      responses:
        '200':
          description: 已登录用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /auth/status/:
    get:
      tags:
        - auth
      summary: 探测当前登录态
      description: 未登录时同样返回 200，避免前端首屏用 401 作为正常控制流。
      operationId: getAuthStatus
      security: []
      responses:
        '200':
          description: 当前登录态与可选用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
        '405':
          description: 请求方法不是 GET
          content:
            text/html:
              schema:
                type: string
  /auth/change-password/:
    post:
      tags:
        - auth
      summary: 修改当前用户密码
      description: 要求当前协议登录/CSRF及合法Origin，校验当前密码并应用强度规则；成功重发当前协议票据和防伪Cookie，另一入口Cookie不覆盖。
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 密码修改成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - detail
                properties:
                  detail:
                    type: string
                    example: 密码已修改
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /folders/:
    get:
      tags:
        - folders
      summary: 获取媒体文件夹列表
      operationId: listFolders
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoldersResponse'
        '401':
