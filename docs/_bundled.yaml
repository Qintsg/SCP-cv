          required:
            - kind
          properties:
            kind:
              type: string
              enum:
                - window_1
                - window_2
                - laptop
                - window_3
                - window_4
                - ip_stream
              description: 窗口1–4分别为目录63–66，原生播放仍只占用两窗；未知地址无流，不猜测
            ip_address:
              type: string
              nullable: true
              description: 仅ip_stream使用，须由服务端显式登记许可
        quality:
          $ref: '#/components/schemas/Quality'
    Request:
      oneOf:
        - $ref: '#/components/schemas/SourceRequest'
        - $ref: '#/components/schemas/InputRequest'
    SharingKey:
      type: string
      pattern: ^[0-9a-f]{64}$
