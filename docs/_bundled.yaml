      properties:
        width:
          type: integer
          nullable: true
          minimum: 1
          maximum: 32768
        height:
          type: integer
          nullable: true
          minimum: 1
          maximum: 32768
        fps:
          type: number
          nullable: true
          minimum: 0
          maximum: 240
        bitrate_mbps:
          type: number
          nullable: true
          minimum: 0
          maximum: 1000
    Sdp:
      type: object
      required:
        - type
        - sdp
      properties:
        type:
          type: string
          enum:
            - offer
            - answer
        sdp:
          type: string
          maxLength: 65536
          description: 以v=0和CRLF开头，解码后的UTF-8字节数不超过65536；Unicode可能更早达到字节上限。
    Share:
      type: object
      required:
        - id
        - window_id
        - state
        - has_audio
        - receiver_has_audio
        - source_generation
        - expires_at
        - actual_frames
        - last_frame_at
        - answer
        - stop_reason
        - actual_volume
        - actual_muted
      properties:
        receiver_quality:
          $ref: '#/components/schemas/ReceiverQuality'
        id:
          type: string
          format: uuid
        window_id:
          type: integer
          enum:
            - 1
            - 2
        state:
          type: string
          enum:
            - allocated
            - negotiating
            - receiving
            - stopping
            - closed
            - failed
          description: 接受指令不等于receiving；stopping不等于原生资源已退出。
        has_audio:
          type: boolean
        receiver_has_audio:
          type: boolean
        source_generation:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        expires_at:
          type: string
          format: date-time
        actual_frames:
          type: integer
          format: int64
          minimum: 0
          description: 授权资源激活后的真实视频帧计数；心跳不能增加。
        last_frame_at:
          type: string
          format: date-time
          nullable: true
        answer:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Sdp'
        stop_reason:
          type: string
        actual_volume:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: GET本人当前接收分享时，来自原Worker已提交严格属性回执；未知、离线、停止或缺失为null，不是请求值或可听声音证明。
        actual_muted:
          type: boolean
          nullable: true
          description: 与actual_volume成对的接收页实际属性。无音轨不能报告非静音；未知为null，不能推断声音已停止。
    AudioRequest:
