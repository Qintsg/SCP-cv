        - name
      properties:
        name:
          type: string
        parent_id:
          type: integer
          nullable: true
    FolderResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - folder
          properties:
            folder:
              $ref: '#/components/schemas/Folder'
    FolderDeleteRequest:
      type: object
      properties:
        delete_contents:
          type: boolean
          default: false
          description: true 时永久删除文件夹子树内的媒体源及其上传文件；false 时把受管理原件搬到媒体根目录，遇到未登记文件会拒绝删除。
    FolderUpdateRequest:
      type: object
      properties:
        name:
          type: string
        parent_id:
          type: integer
          nullable: true
    SourceType:
      type: string
      enum:
        - ppt
        - video
        - audio
        - image
        - web
        - custom_stream
        - rtsp_stream
        - srt_stream
    MediaSource:
      type: object
      required:
        - id
        - source_type
        - name
        - uri
        - is_available
        - is_temporary
        - metadata
        - keep_alive
        - preheat_enabled
        - playback_mode
        - preparation_state
        - page_count
        - preview_url
        - thumbnail_url
        - preview_kind
        - preview_label
        - created_at
      properties:
        path:
          type: string
          description: 从/开始；受管上传文件为实际保存的叶名，重名不覆盖
        is_protected:
          type: boolean
          description: 系统内置项禁止编辑、移动、删除；不能通过metadata修改保护
        id:
          type: integer
        source_type:
          $ref: '#/components/schemas/SourceType'
        name:
          type: string
        uri:
          type: string
          description: 授权编辑/播放使用的完整地址，直播URI可能含凭据；普通界面/日志必须脱敏，不得将脱敏展示值回写
        is_available:
          type: boolean
          description: 表示当前配置可尝试打开，不保证依赖就绪、文稿解析成功或实际出画。 PPT/PPTX 默认动态模式独立检查原件存在及登记摘要非空，不受静态制品排队、缺失或失败阻断； 不在列表投影时重新计算原件摘要。显式静态模式须另行通过所选布局的制品门禁。 列表和编辑/移动/上传/重试响应使用相同门禁。直播源仅表示配置可尝试连接， 实际连通、画面和错误以目标播放会话为准。
        stream_identifier:
          type: string
          nullable: true
        folder_id:
          type: integer
          nullable: true
        original_filename:
          type: string
        file_size:
          type: integer
        mime_type:
          type: string
        is_temporary:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          description: |
            媒体源扩展元数据。PPT/PPTX 原件保留在 `uri`，不由制品覆盖。
            原排版制品使用 `slide_images` / `static_pdf`；文字适配制品使用独立的
            `fitted_slide_images` / `fitted_static_pdf`，不覆盖或代替原排版制品。
            页图记录准备状态、原件摘要/修订、制品目录、页数与 `text_layout`（original/fit）；
            PDF 记录同源摘要/修订、路径、页数、SHA256 与 `render_semantics=raster_pages`。
            未准备的对应键可不存在；queued/running/failed/uncertain 不等于静态可播，
            ready 仍须通过当前摘要、修订、页数及文件门禁。不确定作业需核查，不能盲重放。
            顶层 `preparation_state` / `page_count` 描述原排版页图，不代表适配版已准备。
            预览按显式布局读取；提供 `text_layout` 时须与所选原/fit键一致，否则不可用，历史缺声明保留所选键契约。
            直播源的 `stream_status=unverified` 表示登记时未探测连通性。
        keep_alive:
          type: boolean
          deprecated: true
          description: 旧版保持活跃字段，当前与 preheat_enabled 同步
        preheat_enabled:
          type: boolean
          description: 媒体源预热偏好；实际预热取决于源类型及运行时能力，不表示已准备或已播放，不会启动已退役的 PowerPoint
        playback_mode:
          type: string
          enum:
            - ''
            - pdf
            - slide_images
            - libreoffice
            - powerpoint
          description: 当前媒体源投影的默认模式：PPT/PPTX 为 libreoffice，PDF 原源为 pdf，非文稿为空字符串； 不是播放器已确认的实际模式。slide_images / pdf 也用于显式静态模式，需在 OPEN 中选择； powerpoint 仅保留为历史只读兼容值，当前投影不会返回且新 OPEN 不接受，旧入口已退役， 不会因历史实验开关恢复播放。
        preparation_state:
          type: string
          description: 原排版 PPT 页图准备状态（queued/running/ready/failed/uncertain）；缺失、摘要过期或残缺的 ready 清单显示为空并可显式重试，其它媒体源为空；适配版状态见 metadata.fitted_slide_images
        page_count:
          type: integer
          minimum: 0
          description: 原排版 PPT 页图已通过当前投影门禁的页数，未就绪时为 0；不表示动态原件总页数或适配版已准备
        preview_url:
          type: string
          description: 可嵌入前端缩略位的预览 URL；无真实预览时为空字符串
        thumbnail_url:
          type: string
          description: 缩略图 URL，当前与 preview_url 保持一致
        preview_kind:
          type: string
          enum:
            - image
            - video
            - icon
        preview_label:
          type: string
        created_at:
          type: string
          format: date-time
    SourcesResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - sources
            - sync_result
          properties:
            sources:
              type: array
              items:
                $ref: '#/components/schemas/MediaSource'
            sync_result:
              type: object
              additionalProperties:
                type: integer
    SourceResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - source
          properties:
            source:
              $ref: '#/components/schemas/MediaSource'
    LocalSourceCreateRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
        name:
          type: string
        source_type:
          $ref: '#/components/schemas/SourceType'
        folder_id:
          type: integer
          nullable: true
        preheat_enabled:
          type: boolean
          default: true
          description: 是否在播放器启动时预热该媒体源
        keep_alive:
          type: boolean
          deprecated: true
          description: 旧字段兼容别名；建议改用 preheat_enabled
    WebSourceCreateRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
        name:
          type: string
        folder_id:
          type: integer
          nullable: true
        preheat_enabled:
          type: boolean
          default: true
          description: 是否在播放器启动时预热该网页源
        keep_alive:
          type: boolean
          deprecated: true
          description: 旧字段兼容别名；建议改用 preheat_enabled
    StreamSourceCreateRequest:
      type: object
      required:
        - source_type
        - url
      properties:
        source_type:
          type: string
          enum:
            - rtsp_stream
            - srt_stream
            - custom_stream
          description: RTSP、SRT 或 VLC 支持的自定义 IP 媒体流；不能将网页 URL 静默当作视频流
        url:
          type: string
          format: uri
          description: |
            RTSP 源使用 rtsp://，SRT 源使用 srt://；自定义流当前支持
            http(s)://、udp://、rtp:// 或 rtmp:// 主机地址。
            RTSP、HTTP(S)、RTMP可内嵌用户名和密码，例如rtsp://operator:example-pass@192.0.2.188/live；
            凭据内特殊字符需百分号编码。SRT/UDP/RTP不支持非空userinfo，SRT仍使用自身查询参数。
            完整地址保存在授权媒体合同中，不能当作对已登录操作员保密或加密存储。
        name:
          type: string
          description: 操作员可识别的名称；省略时以脱敏地址作为名称，不含凭据或已知敏感查询值
        folder_id:
          type: integer
          nullable: true
        preheat_enabled:
          type: boolean
          default: false
