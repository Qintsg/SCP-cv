          description: 网页或直播源可修改URL；RTSP/HTTP(S)/RTMP媒体流支持内嵌凭据，规则同直播登记。必须提交完整原值而非脱敏占位符，变更仅影响后续打开；文件路径不能在此修改
        preheat_enabled:
          type: boolean
          description: 是否在播放器启动时预热该媒体源
        keep_alive:
          type: boolean
          deprecated: true
          description: 旧字段兼容别名；建议改用 preheat_enabled
    PlaybackState:
      type: string
      enum:
        - idle
        - loading
        - playing
        - paused
        - stopped
        - error
    DisplayMode:
      type: string
      enum:
        - single
    SessionSnapshot:
      type: object
      required:
        - window_id
        - session_id
        - source_name
        - source_type
        - source_type_label
        - source_uri
        - playback_mode
        - playback_state
        - playback_state_label
        - error_message
        - display_mode
        - display_mode_label
        - target_display_label
        - current_slide
        - total_slides
        - position_ms
        - duration_ms
        - pending_command
        - last_updated_at
        - volume
        - is_muted
        - loop_enabled
        - player_online
        - player_last_seen_at
      properties:
        submitted_command_id:
          type: string
          format: uuid
          description: 仅此次显示命令入队响应的目标窗口携带；普通GET和SSE不保留。受理不等于实际完成。
        window_id:
          type: integer
        session_id:
          type: integer
        source_id:
          type: integer
          nullable: true
        source_name:
          type: string
        source_type:
          type: string
        source_type_label:
          type: string
        source_uri:
          type: string
        playback_mode:
          type: string
          enum:
            - ''
            - pdf
            - slide_images
            - libreoffice
            - powerpoint
          description: 播放器上报的当前演示文稿实际放映模式；尚未确认或其它源为空字符串
        playback_state:
          $ref: '#/components/schemas/PlaybackState'
        playback_state_label:
          type: string
        error_message:
          type: string
        display_mode:
          $ref: '#/components/schemas/DisplayMode'
        display_mode_label:
          type: string
        target_display_label:
          type: string
        current_slide:
          type: integer
        total_slides:
          type: integer
        position_ms:
          type: integer
          nullable: true
          description: LibreOffice统一媒体时钟不可得或临时screen_share时为null，不伪造文件进度。
        duration_ms:
          type: integer
          nullable: true
        actual_source_id:
          type: integer
          nullable: true
          description: 最后确认的实际源，可能与请求中的source_id不同；未确认关闭前保留占用。若旧资源已确认关闭且失败候选也已释放，明确为空而非保留已关闭源；清理不确定不得据此猜空输出。
        actual_adapter_kind:
          type: string
        share_id:
          type: string
          format: uuid
          nullable: true
          description: 当前临时共享请求身份；source_id为null、source_type为screen_share，不是媒体库条目。不含receiver能力或信令，服务重启清空。
        actual_share_id:
          type: string
          format: uuid
          nullable: true
          description: 已由原Worker的instance/owner/源代次及实际资源字段匹配的临时输出身份，可在换源待确认时与share_id不同。身份或帧数缺失不由adapter或playing补齐。
        actual_frames:
          type: integer
          format: int64
          minimum: 0
          description: 当前实际共享资源报告的视频后帧计数，不是HTTP请求、心跳或连接次数。零值不能宣称出画；非共享或未知时为0。
        actual_audio:
          type: boolean
          nullable: true
          description: 实际共享接收资源是否有内容音轨；未知或非共享为null，不代表声卡实际已播放。音量/静音能力另行验证。
        actual_fit_text:
          type: boolean
          nullable: true
          description: Worker成功发布的当前文稿文字布局；true为适配，false为原排版，null表示未观测、非文稿或确认无实际输出。失败换源仍有旧资源时保留旧实际布局；旧资源与候选均确认释放时清空，不从desired或OPEN受理推断。
        actual_share_volume:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: 原Worker已提交共享接收页属性回执，动作失败、缺失或非共享为null，不沿用普通volume或请求值。
        actual_share_muted:
          type: boolean
          nullable: true
          description: 与actual_share_volume成对的实际静音属性；无音轨只能true，未知为null。不是声卡可听声音或静音证明。
        desired_generation:
          type: integer
        observed_generation:
          type: integer
        cleanup_pending:
          type: boolean
        pending_command:
          type: string
          nullable: true
          description: 目标队列按序最早未终结的指令，包含待领取Pending和执行中Processing；空值不证明动画或媒体效果结束。
        last_updated_at:
          type: string
          format: date-time
        volume:
          type: integer
          minimum: 0
          maximum: 100
        is_muted:
          type: boolean
        loop_enabled:
          type: boolean
        player_online:
          type: boolean
          description: 播放器窗口最近 5 秒内是否上报过心跳
        player_last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: 对应窗口播放器最后一次上报心跳的时间
    SessionsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - sessions
          properties:
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/SessionSnapshot'
    CreateRequest:
      type: object
