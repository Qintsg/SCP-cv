  /sources/streams/:
    post:
      tags:
        - sources
      summary: 登记直播媒体流
      description: 保存可尝试打开的流地址；返回的 is_available 不表示已经连通，metadata.stream_status 为 unverified，实际结果以播放会话与画面为准。
      operationId: addStreamSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamSourceCreateRequest'
      responses:
        '201':
          description: 登记成功，尚未验证播出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
  /sources/{source_id}/move/:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    patch:
      tags:
        - sources
      summary: 移动媒体源到指定文件夹
      operationId: moveSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveSourceRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '400':
          description: 原件正在播放、转换、被占用或缺少移动权限；拒绝移动且保留原路径及内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: media_error
                detail: 媒体原件被占用或没有移动权限，移动未生效。
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /sources/{source_id}/download/:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      tags:
        - sources
      summary: 下载文件型媒体源
      operationId: downloadSource
      responses:
        '200':
          description: 文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /sources/{source_id}/preview/:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      tags:
        - sources
      summary: 获取图片或视频源 inline 预览
      operationId: previewSource
      responses:
        '200':
          description: 图片或视频文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /sources/{source_id}/slides/{page}/:
    parameters:
      - $ref: '#/components/parameters/SourceId'
      - in: path
        name: page
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags:
        - sources
      summary: 读取已准备的 PPT 指定页 PNG，需当前会话
      operationId: getPptSlideImage
      description: 按对应布局的同源摘要、修订、页数和受管理制品读取PNG，不借其它布局或历史页资源地址。 缺所选制品、过期或不完整时明确不可用，不表示原件不能动态打开。
      parameters:
        - in: query
          name: fit_text
          required: false
          description: 仅接受单值 true/false，缺省 false；重复或其它值返回400。
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 逐页 PNG 文件流
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /sources/{source_id}/prepare/:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    post:
      tags:
        - sources
      summary: 对失败或旧 PPT 源显式重新排队逐页图片转换
      operationId: retryPptSlideImagePreparation
      description: 结果不确定的LibreOffice操作不会盲目重试；原件始终保留。 缺少摘要的旧 PPT 仅在显式请求时从原件只读流补摘要，不在列表或启动时批量扫描。 文件读取在数据库写门禁外，提交前核对路径、版本及未决作业；变化时明确拒绝。 正常 queued/running 及可用的成功页图保持幂等，损坏/过期成功清单可显式重新排队。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fit_text:
                  type: boolean
                  default: false
                  description: 明确准备独立文字适配版，不覆盖默认原排版制品。
      responses:
        '200':
          description: 返回默认与适配版各自准备状态；动态原件能力独立，受理不代表转换完成。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /sources/{source_id}/ppt-resources/:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      tags:
        - sources
      summary: 获取 PPT 页资源
      operationId: listPptResources
      description: 按明确选择的原排版或文字适配制品生成当前页/下一页图片地址，不借另一布局。 制品摘要、修订、页数及受管理文件门禁通过后才提供图片；未准备时可保留已有备注和媒体信息，图片地址为空。 控制端应沿实际播放源和 actual_fit_text 选择；受理的期望源不是预览依据。
      parameters:
        - in: query
          name: fit_text
          required: false
          description: 仅接受单值 true/false，缺省为原排版 false；重复或其它值返回400。
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PptResourcesResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    put:
      tags:
        - sources
      summary: 覆盖保存 PPT 页资源
      operationId: replacePptResources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PptResourcesReplaceRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PptResourcesResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /sources/{source_id}/:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    patch:
      tags:
        - sources
      summary: 更新媒体源名称、网页或直播地址及预热开关
      operationId: updateSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags:
        - sources
      summary: 删除媒体源
      operationId: deleteSource
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 原件被占用、只读、正在播放或转换；删除未生效且保留源记录
          content:
