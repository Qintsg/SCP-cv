          type: integer
          minimum: 1
          description: 目标媒体源 ID；audio 类型源会被拒绝，请使用背景音乐接口播放
        media_source_id:
          type: integer
          minimum: 1
          description: 兼容旧字段名
        autoplay:
          type: boolean
          default: true
        target_slide:
          type: integer
          minimum: 1
          description: PPT 打开后自动跳转的页码；非 PPT 源忽略
        presentation_mode:
          type: string
          enum:
            - libreoffice
            - slide_images
            - pdf
          description: PPT/PPTX默认LibreOffice；页图与只含图片的同源PDF须显式选择且准备完成。PDF原源仍为PDF。
        fit_text:
          type: boolean
          default: false
          description: 明确开启时只在内存中缩放文字适应原框；静态模式使用独立适配版制品，不修改原件。
    PlaybackStateResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - sessions
            - background_audio
          properties:
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/SessionSnapshot'
            background_audio:
              $ref: '#/components/schemas/BackgroundAudioSnapshot'
    PlaybackAction:
      type: string
      enum:
        - play
        - pause
        - stop
        - next_effect
        - previous_effect
    PlaybackControlRequest:
      type: object
      required:
        - action
      properties:
        action:
          $ref: '#/components/schemas/PlaybackAction'
    PlaybackCommandSnapshot:
      type: object
      required:
        - command_id
        - window_id
        - command
        - source_generation
        - status
        - result_code
        - completed_at
      properties:
        command_id:
          type: string
          format: uuid
        window_id:
          type: integer
          minimum: 1
          maximum: 2
        command:
          type: string
          description: 持久命令名称，例如NEXT_EFFECT或NEXT
        source_generation:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
            - superseded
            - uncertain
        result_code:
          type: string
          description: completed/presentation_at_last_slide仅表示确认末页无操作；失败或uncertain不显示末页成功提示
        completed_at:
          type: string
          format: date-time
          nullable: true
    NavigateAction:
      type: string
      enum:
        - next
        - prev
        - previous
        - first
        - last
        - goto
        - seek
    NavigateContentRequest:
      type: object
      description: goto必须提供正整数target_index；缺失、null、非整数或越出int32的值在入队前400拒绝。first/last按已知页数派生，不要求target_index。HTTP成功仅表示意图已受理，非原生动作或动画完成。
      required:
        - action
      properties:
        action:
          $ref: '#/components/schemas/NavigateAction'
        target_index:
          type: integer
          format: int32
          description: 当action=goto时必填且大于0；不将缺失值默认为第一页。其它导航沿既有派生/钳制语义，超总页数不代表目标已显示。
        position_ms:
          type: integer
          description: 当 action=seek 时使用
      oneOf:
        - required:
            - action
            - target_index
          properties:
            action:
              type: string
              enum:
                - goto
            target_index:
              type: integer
              format: int32
              minimum: 1
              maximum: 2147483647
        - required:
            - action
          properties:
            action:
              type: string
              enum:
                - next
                - prev
                - previous
                - first
                - last
                - seek
    PptMediaControlRequest:
      type: object
      required:
        - action
      properties:
        action:
          $ref: '#/components/schemas/PlaybackAction'
        media_id:
          type: string
        media_index:
          type: integer
    ToggleLoopRequest:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
    SetWindowVolumeRequest:
      type: object
      properties:
        volume:
          type: integer
          minimum: 0
          maximum: 100
          default: 100
    SetWindowMuteRequest:
      type: object
      properties:
        muted:
          type: boolean
          default: false
    ShutdownResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - sessions
            - detail
          properties:
            sessions:
              type: array
              description: 停止确认及意图清理后的两窗快照；pending为空不等于最后实际源已观测为空
              items:
                $ref: '#/components/schemas/SessionSnapshot'
            detail:
              type: string
              example: 系统关闭请求已发送
    RestartResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - sessions
            - detail
          properties:
            sessions:
              type: array
              description: 未配置Supervisor时仿真停止及意图清理后的两窗快照
              items:
                $ref: '#/components/schemas/SessionSnapshot'
            detail:
              type: string
              example: 系统重启请求已发送
    DisplayTarget:
      type: object
      required:
        - index
        - name
        - width
        - height
        - x
        - 'y'
        - is_primary
        - playback_role
        - is_playback_target
      properties:
        index:
          type: integer
        name:
          type: string
        width:
          type: integer
        height:
          type: integer
        x:
          type: integer
        'y':
          type: integer
        is_primary:
          type: boolean
        playback_role:
          type: string
          enum:
            - ''
            - big_left
            - big_right
          description: 仅大屏输出有对应角色，其余显示器只用于诊断
        is_playback_target:
          type: boolean
          description: 当前安全模式下是否允许作为播放窗口目标；Hardware 仅允许两块绑定的大屏
    DisplaysResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - targets
          properties:
            targets:
              type: array
              items:
                $ref: '#/components/schemas/DisplayTarget'
    SelectDisplayRequest:
      type: object
      properties:
        window_id:
          type: integer
          minimum: 1
          maximum: 2
          default: 1
        display_mode:
          $ref: '#/components/schemas/DisplayMode'
        target_label:
          type: string
          description: 单屏模式可省略，省略时由后端选择默认显示器
    DeviceDescriptor:
      type: object
      required:
        - name
        - device_type
        - device_type_label
        - host
        - port
        - action
        - detail
      properties:
        name:
          type: string
        device_type:
          type: string
          enum:
            - splice_screen
            - tv_left
            - tv_right
        device_type_label:
          type: string
        host:
          type: string
        port:
          type: integer
        action:
          type: string
        detail:
          type: string
    DevicesResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - devices
          properties:
            devices:
              type: array
              items:
                $ref: '#/components/schemas/DeviceDescriptor'
    DeviceResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - device
          properties:
            device:
              $ref: '#/components/schemas/DeviceDescriptor'
    ScenarioTelevision:
      type: object
      properties:
        state:
          type: string
          enum:
            - keep
            - set
          default: keep
        input:
          type: object
          allOf:
            - $ref: '#/components/schemas/VideoWallInput'
          nullable: true
      description: 缺省保持；set必须提供已登记输入，keep不得夹带input。每台电视单路全屏，不控制电源
    ScenarioTelevisions:
      type: object
      properties:
        tv_left:
          $ref: '#/components/schemas/ScenarioTelevision'
        tv_right:
          $ref: '#/components/schemas/ScenarioTelevision'
      description: 旧预案缺省两台保持。相同可信来源预案跳过，未知或失败仍重发
    ScenarioAdvanced:
      type: object
      description: 保存是意图，不保证设备可执行；激活前检查全部绑定。空值保持，不调用默认位置。
      properties:
        televisions:
          $ref: '#/components/schemas/ScenarioTelevisions'
        wall_layout_code:
          type: string
          nullable: true
          maxLength: 480
          pattern: ^[A-Za-z0-9]*$
          description: 可解析完整布局的v1短码；null或空串不覆盖旧布局字段，不建数据库码表。配置后优先于旧单/双屏字段，保存可含预留输入，激活前全量预检
        camera_positions:
          type: object
          additionalProperties:
            type: integer
            nullable: true
            minimum: 0
            maximum: 255
          description: 键仅rear/center1/center2/left/right；0或null保持（保存归一null）；固定监控拒绝，实际可调用位置由能力校验
        audio:
          $ref: '#/components/schemas/VenueAudioSettings'
    SourceState:
      type: string
      enum:
        - unset
        - empty
        - set
    ScenarioTarget:
      type: object
      required:
        - window_id
        - source_state
        - autoplay
        - resume
      properties:
        window_id:
          type: integer
          minimum: 1
          maximum: 4
          description: 新预案仅使用 1-2；旧预案可只读返回历史 3-4 目标，但有效目标激活前会被拒绝
        source_state:
          $ref: '#/components/schemas/SourceState'
        source_id:
          type: integer
          nullable: true
        source_name:
          type: string
        autoplay:
          type: boolean
        resume:
          type: boolean
    Scenario:
      type: object
      required:
        - id
        - name
        - description
        - sort_order
        - big_screen_mode_state
        - big_screen_mode
        - big_screen_mode_label
        - volume_state
        - volume_level
        - targets
        - created_at
        - updated_at
      properties:
        folder_id:
          type: integer
          nullable: true
        path:
          type: string
          description: 从/开始的预设路径
        advanced:
          $ref: '#/components/schemas/ScenarioAdvanced'
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        sort_order:
          type: integer
        big_screen_mode_state:
          $ref: '#/components/schemas/SourceState'
        big_screen_mode:
          $ref: '#/components/schemas/BigScreenMode'
        big_screen_mode_label:
          type: string
        volume_state:
          $ref: '#/components/schemas/SourceState'
        volume_level:
          type: integer
          minimum: 0
          maximum: 100
        targets:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioTarget'
        window1_source_id:
          type: integer
          nullable: true
        window1_source_name:
          type: string
        window1_autoplay:
          type: boolean
        window1_resume:
          type: boolean
        window2_source_id:
          type: integer
          nullable: true
        window2_source_name:
          type: string
        window2_autoplay:
          type: boolean
        window2_resume:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ScenariosResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - scenarios
          properties:
            scenarios:
              type: array
              items:
                $ref: '#/components/schemas/Scenario'
    ScenarioTargetInput:
      type: object
      required:
        - window_id
      properties:
        window_id:
          type: integer
          minimum: 1
          maximum: 2
        source_state:
          $ref: '#/components/schemas/SourceState'
        source_id:
          type: integer
          nullable: true
        autoplay:
          type: boolean
          default: true
        resume:
          type: boolean
          default: true
    ScenarioCreateRequest:
      type: object
      required:
        - name
      properties:
        folder_id:
          type: integer
          nullable: true
        advanced:
          $ref: '#/components/schemas/ScenarioAdvanced'
        name:
          type: string
        description:
          type: string
        big_screen_mode_state:
          $ref: '#/components/schemas/SourceState'
        big_screen_mode:
          $ref: '#/components/schemas/BigScreenMode'
        volume_state:
          $ref: '#/components/schemas/SourceState'
        volume_level:
          type: integer
          minimum: 0
          maximum: 100
          default: 100
        targets:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioTargetInput'
    ScenarioResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - scenario
          properties:
            scenario:
              $ref: '#/components/schemas/Scenario'
    ScenarioCaptureRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        scenario_id:
          type: integer
          nullable: true
          description: 传入时覆盖已有预案
    ScenarioUpdateRequest:
      type: object
      properties:
        folder_id:
          type: integer
          nullable: true
          description: 未提交保持；null移到根
        advanced:
          $ref: '#/components/schemas/ScenarioAdvanced'
        name:
          type: string
        description:
          type: string
        big_screen_mode_state:
          $ref: '#/components/schemas/SourceState'
        big_screen_mode:
          $ref: '#/components/schemas/BigScreenMode'
        volume_state:
          $ref: '#/components/schemas/SourceState'
        volume_level:
          type: integer
          minimum: 0
          maximum: 100
        targets:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioTargetInput'
  responses:
    ErrorResponse:
      description: 统一错误响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ShareResponse:
      description: 本人内存分享状态，无接收token；仅受理或停止待确认不是实际出画或实际释放证明。
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessResponse'
              - type: object
                required:
                  - share
                properties:
                  share:
                    $ref: '#/components/schemas/Share'
    AudioAcceptedResponse:
      description: 共享专用音频命令已入队；不更新实际音量或源代次，不表示已经出声。
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessResponse'
              - type: object
                required:
                  - submitted_command_id
                  - window_id
                  - share_id
                  - source_generation
                properties:
                  submitted_command_id:
                    type: string
                    format: uuid
                  window_id:
                    type: integer
                    enum:
                      - 1
                      - 2
                  share_id:
                    type: string
                    format: uuid
                  source_generation:
                    type: integer
                    format: int64
                    minimum: 1
    SuccessResponse:
      description: 该接收操作已受理，不能用作原生资源退出证明。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FolderId:
      in: path
      name: folder_id
      required: true
      schema:
        type: integer
    SourceId:
      in: path
      name: source_id
      required: true
      schema:
        type: integer
    ShareId:
      name: share_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WindowId:
      name: window_id
      in: query
      required: true
      schema:
        type: integer
        enum:
          - 1
          - 2
    Generation:
      name: source_generation
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    WindowId-2:
      in: path
      name: window_id
      required: true
      description: 大屏播放窗口编号，当前有效范围为 1-2；旧窗口 3/4 请求会被拒绝
      schema:
        type: integer
        minimum: 1
        maximum: 2
    DeviceType:
      in: path
      name: device_type
      required: true
      schema:
        type: string
        enum:
          - splice_screen
          - tv_left
          - tv_right
    PowerAction:
      in: path
      name: action
      required: true
      schema:
        type: string
        enum:
          - 'on'
          - 'off'
    ScenarioId:
      in: path
      name: scenario_id
      required: true
      schema:
        type: integer
