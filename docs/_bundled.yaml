          format: int64
        volume:
          type: integer
          minimum: 0
          maximum: 100
        is_muted:
          type: boolean
        loop_enabled:
          type: boolean
          description: 是否在自然播放到列表末尾后回到首项；false时末曲自然结束后保留末曲并停止，中间曲仍推进下一首。不是单曲循环。
        pending_command:
          type: string
          description: 音频队列按序最早未终结的指令，包含Pending和Processing；空字符串表示无未终结命令，不证明音频实际播放完成。
          enum:
