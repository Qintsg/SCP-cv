            minimum: 0
      responses:
        '200':
          description: SSE 数据流
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  id: 12
                  event: playback_state
                  data: {"sessions": [], "background_audio": {"state": {"playback_state": "idle"}, "playlist": []}}
        '401':
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: HTTPS入口的Secure/HttpOnly会话Cookie，票据绑定https，不接受HTTP入口票据改名。
    sessionAuthHttp:
      type: apiKey
      in: cookie
      name: sessionid_http
      description: HTTP入口的独立HttpOnly/SameSite=Lax会话Cookie，票据绑定http；明文不保护传输内容。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: POST/PATCH/PUT/DELETE须使用当前入口防伪令牌；HTTPS读取csrftoken，HTTP读取csrftoken_http，不能跨协议替用。
    screenShareReceiver:
      type: http
      scheme: bearer
      description: 内存256位随机cap，仅原Worker能领取，绑定share/window/generation/instance/owner/group；不持久、不写查询串或日志。
  schemas:
    VideoWallInput:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - window_1
            - window_2
            - laptop
            - ip_stream
            - window_3
            - window_4
          description: 窗口1–4固定登记63–66，IP81为现场输入；3/4可作为预览及组播来源，但仍不创建原生播放窗口
        ip_address:
          anyOf:
            - type: string
              format: ipv4
            - type: string
              enum:
                - ''
          description: 仅kind=ip_stream填写IPv4，其它输入使用空串或省略；须匹配服务器已登记的设备流描述，未登记时只可保存预览
    Item:
      type: object
      required:
        - id
        - name
        - group
        - ip_suffix
        - preview_input
        - source_id
        - availability
        - is_available
        - checked_at
        - aliases
      properties:
        id:
          type: string
        name:
          type: string
        group:
          type: string
          enum:
            - workstation
            - camera
            - site
        ip_suffix:
          type: integer
          minimum: 1
          maximum: 254
        preview_input:
          $ref: '#/components/schemas/VideoWallInput'
        source_id:
          type: integer
          format: int64
          nullable: true
        availability:
          type: string
          enum:
            - unknown
            - reachable
            - unreachable
        is_available:
          type: boolean
          description: 仅RTSP/RTMP服务端口可达，不是画面确认
        checked_at:
          type: string
          format: date-time
          nullable: true
        aliases:
          type: array
          items:
            type: string
    Response:
      type: object
      required:
        - success
        - inputs
      properties:
        success:
          type: boolean
          enum:
            - true
        inputs:
          type: array
          maxItems: 31
          items:
            $ref: '#/components/schemas/Item'
    ErrorResponse:
      type: object
      required:
        - detail
        - code
      properties:
        detail:
          type: string
          example: 请求体必须是合法 JSON
        code:
          type: string
          example: invalid_json
    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
    DisplayRoutingIntent:
      type: object
      properties:
        input:
          type: object
          allOf:
            - $ref: '#/components/schemas/VideoWallInput'
          nullable: true
        layout_code:
          type: string
          nullable: true
          description: 大屏最后完整下发的可解析布局码，电视使用input
    DisplayRoutingTarget:
      type: object
      required:
        - target
        - status
        - last_sent
        - updated_at
      description: 服务端最后下发的逻辑记录，不是实体实时读回；失败仍可保留历史last_sent，但不可用于跳过
      properties:
        target:
          type: string
          enum:
            - wall
            - tv_left
            - tv_right
        status:
          type: string
          enum:
            - unknown
            - dispatching
            - sent_unconfirmed
            - simulated
            - uncertain
        last_sent:
          type: object
          allOf:
            - $ref: '#/components/schemas/DisplayRoutingIntent'
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    Quality:
      type: string
      enum:
        - low
        - high
      default: low
      description: 观看意图；实际输出仍受共享预算与拥塞约束
    SourceRequest:
      type: object
      additionalProperties: false
      required:
        - source_id
      properties:
        source_id:
          type: integer
          format: int64
          minimum: 1
          description: 已登记的RTSP或RTMP媒体源
        quality:
          $ref: '#/components/schemas/Quality'
    InputRequest:
      type: object
