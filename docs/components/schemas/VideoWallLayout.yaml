type: object
required:
  - name
  - preset
  - mappings
  - can_apply
  - unavailable_reason
properties:
  name:
    type: string
  preset:
    type: string
    enum: ['', window_1_fullscreen, window_1_left_window_2_right]
  mappings:
    type: array
    minItems: 1
    maxItems: 2
    items:
      $ref: ./VideoWallMapping.yaml
  can_apply:
    type: boolean
    description: 只有两个已抓包固定预设为 true
  unavailable_reason:
    type: string
