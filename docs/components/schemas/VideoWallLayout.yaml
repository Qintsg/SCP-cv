type: object
required:
  - name
  - preset
  - mappings
  - can_apply
  - unavailable_reason
properties:
  name:
    type: string
  preset:
    type: string
    enum: ['', window_1_fullscreen, window_1_left_window_2_right]
  mappings:
    type: array
    minItems: 1
    maxItems: 2
    items:
      $ref: ./VideoWallMapping.yaml
  can_apply:
    type: boolean
    description: 服务端对输入描述、受限布局及协议配置预检通过时为true，不证明实体出画
  unavailable_reason:
    type: string
