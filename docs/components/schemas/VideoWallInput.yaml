type: object
required:
  - kind
properties:
  kind:
    type: string
    enum: [window_1, window_2, laptop, ip_stream, window_3, window_4]
    description: 窗口3/4仅前端规划预留，服务端拒绝实体应用，未绑定猜测的输入地址
  ip_address:
    oneOf:
      - type: string
        format: ipv4
      - type: string
        enum: ['']
    description: 仅kind=ip_stream填写IPv4，其它输入使用空串或省略；须匹配服务器已登记的设备流描述，未登记时只可保存预览
