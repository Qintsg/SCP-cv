type: object
required:
  - kind
properties:
  kind:
    type: string
    enum: [window_1, window_2, laptop, ip_stream, window_3, window_4]
    description: 窗口1–4固定登记63–66，IP81为现场输入；3/4可作为预览及组播来源，但仍不创建原生播放窗口
  ip_address:
    oneOf:
      - type: string
        format: ipv4
      - type: string
        enum: ['']
    description: 仅kind=ip_stream填写IPv4，其它输入使用空串或省略；须匹配服务器已登记的设备流描述，未登记时只可保存预览
