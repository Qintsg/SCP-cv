type: object
required:
  - id
  - source_type
  - name
  - uri
  - is_available
  - is_temporary
  - metadata
  - keep_alive
  - preheat_enabled
  - playback_mode
  - preparation_state
  - page_count
  - preview_url
  - thumbnail_url
  - preview_kind
  - preview_label
  - created_at
properties:
  id:
    type: integer
  source_type:
    $ref: ./SourceType.yaml
  name:
    type: string
  uri:
    type: string
  is_available:
    type: boolean
    description: 对直播源表示配置可尝试播放，并非已连通或已出画；实际状态以目标播放会话为准
  stream_identifier:
    type: string
    nullable: true
  folder_id:
    type: integer
    nullable: true
  original_filename:
    type: string
  file_size:
    type: integer
  mime_type:
    type: string
  is_temporary:
    type: boolean
  expires_at:
    type: string
    format: date-time
    nullable: true
  metadata:
    type: object
    additionalProperties: true
    description: |
      媒体源扩展元数据。PPT/PPTX 源的 `slide_images` 记录逐页图片准备状态、
      原件摘要、制品路径与页数；原始文稿仍保留在 `uri`。
      直播源的 `stream_status=unverified` 表示登记时未探测连通性。
  keep_alive:
    type: boolean
    deprecated: true
    description: 旧版保持活跃字段，当前与 preheat_enabled 同步
  preheat_enabled:
    type: boolean
    description: 媒体源预热开关；播放器启动时按源类型提前准备后台资源，PowerPoint 预热当前停用
  playback_mode:
    type: string
    enum:
      - ''
      - pdf
      - slide_images
      - powerpoint
    description: PPT/PPTX 默认 slide_images，PDF 为 pdf；实际原生放映需显式实验开关
  preparation_state:
    type: string
    description: PPT 页图准备状态（queued/running/ready/failed/uncertain），其它媒体源为空
  page_count:
    type: integer
    minimum: 0
    description: 已准备的 PPT 页图数，未就绪时为 0
  preview_url:
    type: string
    description: 可嵌入前端缩略位的预览 URL；无真实预览时为空字符串
  thumbnail_url:
    type: string
    description: 缩略图 URL，当前与 preview_url 保持一致
  preview_kind:
    type: string
    enum:
      - image
      - video
      - icon
  preview_label:
    type: string
  created_at:
    type: string
    format: date-time
