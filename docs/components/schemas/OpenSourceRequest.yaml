type: object
required:
  - source_id
properties:
  source_id:
    type: integer
    minimum: 1
    description: 目标媒体源 ID；audio 类型源会被拒绝，请使用背景音乐接口播放
  media_source_id:
    type: integer
    minimum: 1
    description: 兼容旧字段名
  autoplay:
    type: boolean
    default: true
  target_slide:
    type: integer
    minimum: 1
    description: PPT 打开后自动跳转的页码；非 PPT 源忽略
  presentation_mode:
    type: string
    enum: [libreoffice, slide_images, pdf]
    description: PPT/PPTX默认LibreOffice；页图与只含图片的同源PDF须显式选择且准备完成。PDF原源仍为PDF。
  fit_text:
    type: boolean
    default: false
    description: 明确开启时只在内存中缩放文字适应原框；静态模式使用独立适配版制品，不修改原件。
