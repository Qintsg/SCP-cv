type: object
description: grid区域必填，10列5行，零起点、正跨度、不越界不重叠；不能与旧区域混用
required: [column, row, columns, rows]
additionalProperties: false
properties:
  column:
    type: integer
    minimum: 0
    maximum: 9
  row:
    type: integer
    minimum: 0
    maximum: 4
  columns:
    type: integer
    minimum: 1
    maximum: 10
  rows:
    type: integer
    minimum: 1
    maximum: 5
