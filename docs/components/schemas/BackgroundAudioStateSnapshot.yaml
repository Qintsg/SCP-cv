type: object
required:
  - id
  - source_id
  - source_name
  - source_uri
  - source
  - current_item_id
  - playback_state
  - playback_state_label
  - error_message
  - position_ms
  - duration_ms
  - volume
  - is_muted
  - loop_enabled
  - pending_command
  - updated_at
properties:
  id:
    type: integer
  source_id:
    type: integer
    nullable: true
    description: 当前背景音频源 ID；待机或清空时为 null
  source_name:
    type: string
  source_uri:
    type: string
  source:
    type: object
    nullable: true
    allOf:
      - $ref: ./MediaSource.yaml
  current_item_id:
    type: integer
    nullable: true
    description: 当前音频源对应的播放列表项 ID
  playback_state:
    $ref: ./PlaybackState.yaml
  playback_state_label:
    type: string
  error_message:
    type: string
  position_ms:
    type: integer
    format: int64
  duration_ms:
    type: integer
    format: int64
  volume:
    type: integer
    minimum: 0
    maximum: 100
  is_muted:
    type: boolean
  loop_enabled:
    type: boolean
    description: 是否在自然播放到列表末尾后回到首项；false时末曲自然结束后保留末曲并停止，中间曲仍推进下一首。不是单曲循环。
  pending_command:
    type: string
    description: 音频队列按序最早未终结的指令，包含Pending和Processing；空字符串表示无未终结命令，不证明音频实际播放完成。
    enum:
      - ''
      - OPEN
      - PLAY
      - PAUSE
      - STOP
      - SEEK
      - SET_LOOP
      - SET_VOLUME
      - SET_MUTE
  updated_at:
    type: string
    format: date-time
    description: 音频状态、设置和播放列表操作的观测更新时间；实际加入推进、重复加入不变。客户端用于隔离较旧响应，不是媒体库元信息修订号、主机身份或实体播放完成证明。
