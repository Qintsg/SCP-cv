type: object
required:
  - id
  - name
properties:
  is_protected:
    type: boolean
  id:
    type: integer
  name:
    type: string
  relative_path:
    type: string
    description: 以/开始的目录路径，使用正斜杠分隔；内置目录不可添加或修改
  parent_id:
    type: integer
    nullable: true
  created_at:
    type: string
    format: date-time
    nullable: true
  updated_at:
    type: string
    format: date-time
    nullable: true
