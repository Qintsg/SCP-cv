type: object
properties:
  name:
    type: string
  uri:
    type: string
    description: 网页或直播源可修改 URL，流地址变更仅影响后续打开；文件原件路径不能在此修改
  preheat_enabled:
    type: boolean
    description: 是否在播放器启动时预热该媒体源
  keep_alive:
    type: boolean
    deprecated: true
    description: 旧字段兼容别名；建议改用 preheat_enabled
