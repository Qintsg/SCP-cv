type: object
required:
  - window_id
  - source_state
  - autoplay
  - resume
properties:
  window_id:
    type: integer
    minimum: 1
    maximum: 4
    description: 新预案仅使用 1-2；旧预案可只读返回历史 3-4 目标，但有效目标激活前会被拒绝
  source_state:
    $ref: ./SourceState.yaml
  source_id:
    type: integer
    nullable: true
  source_name:
    type: string
  autoplay:
    type: boolean
  resume:
    type: boolean
