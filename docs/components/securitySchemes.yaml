sessionAuth:
  type: apiKey
  in: cookie
  name: sessionid
  description: HTTPS入口的Secure/HttpOnly会话Cookie，票据绑定https，不接受HTTP入口票据改名。
sessionAuthHttp:
  type: apiKey
  in: cookie
  name: sessionid_http
  description: HTTP入口的独立HttpOnly/SameSite=Lax会话Cookie，票据绑定http；明文不保护传输内容。
csrfToken:
  type: apiKey
  in: header
  name: X-CSRFToken
  description: POST/PATCH/PUT/DELETE须使用当前入口防伪令牌；HTTPS读取csrftoken，HTTP读取csrftoken_http，不能跨协议替用。
