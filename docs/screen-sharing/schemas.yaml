# 屏幕共享HTTP类型与有界信令；不包含接收凭据。SCP-cv 2026-10-10。
ShareId:
  name: share_id
  in: path
  required: true
  schema:
    type: string
    format: uuid
WindowId:
  name: window_id
  in: query
  required: true
  schema:
    type: integer
    enum: [1, 2]
Generation:
  name: source_generation
  in: query
  required: true
  schema:
    type: integer
    format: int64
    minimum: 1
CreateRequest:
  type: object
  required: [window_id]
  properties:
    window_id:
      type: integer
      enum: [1, 2]
    has_audio:
      type: boolean
      default: false
      description: 原生采集实际返回内容音轨，不是希望获取麦克风。
Sdp:
  type: object
  required: [type, sdp]
  properties:
    type:
      type: string
      enum: [offer, answer]
    sdp:
      type: string
      maxLength: 65536
      description: 以v=0和CRLF开头，解码后的UTF-8字节数不超过65536；Unicode可能更早达到字节上限。
VideoPolicy:
  type: object
  required: [full_hd_bitrate, qhd_bitrate, ultra_hd_bitrate, max_frame_rate]
  properties:
    full_hd_bitrate:
      type: integer
      minimum: 1000000
      maximum: 200000000
      default: 16000000
    qhd_bitrate:
      type: integer
      minimum: 1000000
      maximum: 200000000
      default: 24000000
    ultra_hd_bitrate:
      type: integer
      minimum: 1000000
      maximum: 200000000
      default: 48000000
    max_frame_rate:
      type: integer
      minimum: 1
      maximum: 30
      default: 30
Share:
  type: object
  required: [id, window_id, state, has_audio, receiver_has_audio, source_generation, expires_at, actual_frames, last_frame_at, answer, stop_reason, actual_volume, actual_muted]
  properties:
    video_policy:
      $ref: '#/VideoPolicy'
    receiver_quality:
      $ref: '../components/schemas/ReceiverQuality.yaml'
    id:
      type: string
      format: uuid
    window_id:
      type: integer
      enum: [1, 2]
    state:
      type: string
      enum: [allocated, negotiating, receiving, stopping, closed, failed]
      description: 接受指令不等于receiving；stopping不等于原生资源已退出。
    has_audio:
      type: boolean
    receiver_has_audio:
      type: boolean
    source_generation:
      type: integer
      format: int64
      minimum: 1
      nullable: true
    expires_at:
      type: string
      format: date-time
    actual_frames:
      type: integer
      format: int64
      minimum: 0
      description: 授权资源激活后的真实视频帧计数；心跳不能增加。
    last_frame_at:
      type: string
      format: date-time
      nullable: true
    answer:
      type: object
      nullable: true
      allOf:
        - $ref: '#/Sdp'
    stop_reason:
      type: string
    actual_volume:
      type: integer
      minimum: 0
      maximum: 100
      nullable: true
      description: GET本人当前接收分享时，来自原Worker已提交严格属性回执；未知、离线、停止或缺失为null，不是请求值或可听声音证明。
    actual_muted:
      type: boolean
      nullable: true
      description: 与actual_volume成对的接收页实际属性。无音轨不能报告非静音；未知为null，不能推断声音已停止。
ShareResponse:
  description: 本人内存分享状态，无接收token；仅受理或停止待确认不是实际出画或实际释放证明。
  headers:
    Cache-Control:
      schema:
        type: string
        enum: [no-store]
  content:
    application/json:
      schema:
        allOf:
          - $ref: ../components/schemas/SuccessResponse.yaml
          - type: object
            required: [share]
            properties:
              share:
                $ref: '#/Share'
SuccessResponse:
  description: 该接收操作已受理，不能用作原生资源退出证明。
  content:
    application/json:
      schema:
        $ref: ../components/schemas/SuccessResponse.yaml
AudioRequest:
  type: object
  additionalProperties: false
  required: [volume, muted]
  properties:
    volume:
      type: integer
      minimum: 0
      maximum: 100
    muted:
      type: boolean
AudioAcceptedResponse:
  description: 共享专用音频命令已入队；不更新实际音量或源代次，不表示已经出声。
  headers:
    Cache-Control:
      schema:
        type: string
        enum: [no-store]
  content:
    application/json:
      schema:
        allOf:
          - $ref: ../components/schemas/SuccessResponse.yaml
          - type: object
            required: [submitted_command_id, window_id, share_id, source_generation]
            properties:
              submitted_command_id:
                type: string
                format: uuid
              window_id:
                type: integer
                enum: [1, 2]
              share_id:
                type: string
                format: uuid
              source_generation:
                type: integer
                format: int64
                minimum: 1
