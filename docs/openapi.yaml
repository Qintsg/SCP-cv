openapi: 3.0.3

info:
  title: SCP-cv REST API
  version: 1.0.0
  license:
    name: Artistic License 2.0
    url: https://opensource.org/license/artistic-2-0
  contact:
    name: SCP-cv 维护团队
  description: |
    SCP-cv 控制台 REST API 文档。

    所有业务路径默认挂载在 `/api` 前缀下；成功响应通常包含 `success: true`，错误响应统一为 `detail + code`。
    业务接口与 `/media/` 文件由 ControlHost 会话 Cookie 鉴权保护；`/auth/csrf/`、`/auth/login/`、`/auth/logout/` 和 `/auth/status/` 为公开入口，`/auth/me/` 要求登录。
    HTTPS使用Secure的sessionid/csrftoken，HTTP使用sessionid_http/csrftoken_http；票据绑定协议，注销只清当前入口。写操作要求当前协议防伪令牌及合法Origin。
    屏幕共享发布者沿用会话/CSRF；原生接收端点仅loopback与私有Authorization Bearer能力，不允许用户Cookie或查询串token代替。

servers:
  - url: /api
    description: 本机 ControlHost REST API 前缀
  - url: http://127.0.0.1:18444/api
    description: 普通本机后端入口（明文）
  - url: https://127.0.0.1:18443/api
    description: 加密本机后端入口，须正常信任证书

tags:
  - name: auth
    description: 登录、登出、CSRF 与当前用户查询
  - name: folders
    description: 媒体文件夹管理
  - name: sources
    description: 媒体源管理、上传、预览与 PPT 页资源
  - name: sessions
    description: 播放会话查询
  - name: playback
    description: 窗口播放、切换、重置和物理冒烟测试
  - name: screen-sharing
    description: 临时网页屏幕共享的发布和原生私有信令；受理不等于出画
  - name: background-audio
    description: 背景音乐播放列表、播放控制与状态查询
  - name: runtime
    description: 全局运行态、系统音量与系统关闭请求
  - name: video-wall
    description: 大屏固定预设与手动映射草稿；未知控制帧仅可保存预览，不可实体应用
  - name: settings
    description: 跨控制端共享的实验性功能设置
  - name: displays
    description: 显示器枚举与窗口显示目标选择
  - name: devices
    description: 外部设备电源控制
  - name: scenarios
    description: 预案创建、编辑、捕获、置顶与激活
  - name: events
    description: Server-Sent Events 播放状态事件流

