get:
  tags:
    - auth
  summary: 获取 CSRF token
  description: |
    显式触发当前入口的防伪Cookie下发：HTTPS为csrftoken，HTTP为csrftoken_http。前端首次加载时调用，之后在不安全方法中把对应值写入X-CSRFToken，不跨协议替用。
  operationId: getCsrfToken
  security: []
  responses:
    '200':
      description: CSRF token 已下发
      headers:
        Set-Cookie:
          description: 当前协议的csrftoken或csrftoken_http，不修改另一协议Cookie。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CsrfTokenResponse.yaml
    '400':
      $ref: ../components/responses/ErrorResponse.yaml
