get:
  tags:
    - scenarios
  summary: 获取预案列表
  operationId: listScenarios
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ScenariosResponse.yaml
    '401':
      $ref: ../components/responses/ErrorResponse.yaml
post:
  tags:
    - scenarios
  summary: 创建预案
  description: >-
    目标source_state为set时必须提供正媒体库source_id；零、负值或空值返回400及
    code scenario_source_invalid。临时屏幕共享不能保存；unset保持当前内容，empty明确清空。
  operationId: createScenario
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ScenarioCreateRequest.yaml
  responses:
    '201':
      description: 创建成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ScenarioResponse.yaml
    '400':
      $ref: ../components/responses/ErrorResponse.yaml
    '401':
      $ref: ../components/responses/ErrorResponse.yaml
