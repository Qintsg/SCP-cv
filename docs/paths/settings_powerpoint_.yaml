get:
  tags: [settings]
  summary: 已退役PowerPoint设置入口
  operationId: getPowerPointSettings
  responses:
    '410':
      $ref: ../components/responses/ErrorResponse.yaml
    '401':
      $ref: ../components/responses/ErrorResponse.yaml
patch:
  tags: [settings]
  summary: 已退役，拒绝启动PowerPoint
  operationId: updatePowerPointSettings
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/PowerPointSettingsUpdateRequest.yaml
  responses:
    '410':
      $ref: ../components/responses/ErrorResponse.yaml
