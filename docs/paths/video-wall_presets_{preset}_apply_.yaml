parameters:
  - in: path
    name: preset
    required: true
    schema:
      type: string
      enum: [window_1_fullscreen, window_1_left_window_2_right]
post:
  tags: [video-wall]
  summary: 应用兼容大屏预设，返回模拟或已发送未确认状态
  operationId: applyVideoWallPreset
  responses:
    '200':
      description: 预设请求完成，不证明实体画面；以dispatch_status说明发送边界
      content:
        application/json:
          schema:
            $ref: ../components/schemas/VideoWallLayoutApplyResponse.yaml
    '400':
      $ref: ../components/responses/ErrorResponse.yaml
