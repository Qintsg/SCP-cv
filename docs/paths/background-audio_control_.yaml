post:
  tags:
    - background-audio
  summary: 控制背景音乐播放
  operationId: controlBackgroundAudio
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/BackgroundAudioControlRequest.yaml
  responses:
    '200':
      description: 指令已持久入队；seek保持当前源/代次，position_ms仍为最后实际观测，不把目标当完成结果。实际定位由后续GET/SSE报告。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BackgroundAudioResponse.yaml
    '400':
      $ref: ../components/responses/ErrorResponse.yaml
