post:
  tags:
    - auth
  summary: 修改当前用户密码
  description: 要求当前协议登录/CSRF及合法Origin，校验当前密码并应用强度规则；成功重发当前协议票据和防伪Cookie，另一入口Cookie不覆盖。
  operationId: changePassword
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ChangePasswordRequest.yaml
  responses:
    '200':
      description: 密码修改成功
      content:
        application/json:
          schema:
            type: object
            required:
              - detail
            properties:
              detail:
                type: string
                example: 密码已修改
    '400':
      $ref: ../components/responses/ErrorResponse.yaml
    '401':
      $ref: ../components/responses/ErrorResponse.yaml
