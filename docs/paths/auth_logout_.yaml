post:
  tags:
    - auth
  summary: 登出并清除当前 session
  description: 未登录可幂等注销；已登录须当前协议CSRF及合法Origin。成功只清当前协议会话/防伪Cookie，保留另一入口会话，返回成功说明。
  operationId: logout
  security: []
  responses:
    '200':
      description: 登出成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/DetailResponse.yaml
    '400':
      $ref: ../components/responses/ErrorResponse.yaml
